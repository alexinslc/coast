<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Coast brand system</title>
  <desc id="desc">Coast visual identity showing the left-aligned momentum mark, app icon, lockups, menu-bar treatment, and palette.</desc>
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211A61"/>
      <stop offset="0.52" stop-color="#111442"/>
      <stop offset="1" stop-color="#080B28"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AE8CFF"/>
      <stop offset="1" stop-color="#8C73FF"/>
    </linearGradient>
    <linearGradient id="momentum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7072FF"/>
      <stop offset="1" stop-color="#515DFF"/>
    </linearGradient>
    <linearGradient id="current" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D55FF"/>
      <stop offset="1" stop-color="#2442E9"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="1120" fill="#F7F8FC"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="100" y="132" fill="#10143D" font-size="76" font-weight="700" letter-spacing="-3">Coast</text>
    <text x="104" y="198" fill="#626C86" font-size="30" font-weight="600">Brand system · Momentum</text>

    <rect x="122" y="220" width="438" height="438" rx="100" fill="url(#iconBg)"/>
    <rect x="123" y="221" width="436" height="436" rx="99" fill="none" stroke="#5B58A8" stroke-opacity="0.28"/>
    <rect x="228" y="342" width="104" height="34" rx="17" fill="url(#violet)"/>
    <rect x="228" y="414" width="167" height="34" rx="17" fill="url(#momentum)"/>
    <rect x="228" y="486" width="233" height="34" rx="17" fill="url(#current)"/>

    <rect x="660" y="190" width="1040" height="260" rx="34" fill="#FFFFFF"/>
    <rect x="750" y="252" width="56" height="28" rx="14" fill="#9A7CFF"/>
    <rect x="750" y="307" width="108" height="28" rx="14" fill="#6068FF"/>
    <rect x="750" y="362" width="162" height="28" rx="14" fill="#2F49F5"/>
    <text x="990" y="360" fill="#10143D" font-size="118" font-weight="570" letter-spacing="-4">Coast</text>

    <rect x="660" y="505" width="500" height="185" rx="30" fill="#FFFFFF"/>
    <text x="704" y="560" fill="#626C86" font-size="25" font-weight="650">Menu bar</text>
    <g fill="#10143D">
      <rect x="750" y="588" width="31" height="10" rx="5"/>
      <rect x="750" y="611" width="49" height="10" rx="5"/>
      <rect x="750" y="634" width="68" height="10" rx="5"/>
    </g>
    <rect x="860" y="576" width="204" height="80" rx="26" fill="#111442"/>
    <g fill="#FFFFFF">
      <rect x="931" y="592" width="18" height="6" rx="3"/>
      <rect x="931" y="608" width="29" height="6" rx="3"/>
      <rect x="931" y="624" width="40" height="6" rx="3"/>
    </g>

    <rect x="1200" y="505" width="500" height="185" rx="30" fill="#111442"/>
    <text x="1244" y="560" fill="#BBC3DC" font-size="25" font-weight="650">Reversed</text>
    <g fill="#FFFFFF">
      <rect x="1275" y="588" width="31" height="10" rx="5"/>
      <rect x="1275" y="611" width="49" height="10" rx="5"/>
      <rect x="1275" y="634" width="68" height="10" rx="5"/>
    </g>
    <text x="1380" y="635" fill="#FFFFFF" font-size="70" font-weight="570" letter-spacing="-2">Coast</text>

    <text x="100" y="792" fill="#10143D" font-size="30" font-weight="700">Palette</text>
    <g font-size="22" font-weight="650">
      <rect x="100" y="830" width="285" height="136" rx="24" fill="#10143D"/>
      <text x="124" y="900" fill="#FFFFFF">Ink</text><text x="124" y="937" fill="#C4CAE0" font-weight="500">#10143D</text>
      <rect x="430" y="830" width="285" height="136" rx="24" fill="#9A7CFF"/>
      <text x="454" y="900" fill="#FFFFFF">Violet</text><text x="454" y="937" fill="#F4F1FF" font-weight="500">#9A7CFF</text>
      <rect x="760" y="830" width="285" height="136" rx="24" fill="#6068FF"/>
      <text x="784" y="900" fill="#FFFFFF">Momentum</text><text x="784" y="937" fill="#F0F1FF" font-weight="500">#6068FF</text>
      <rect x="1090" y="830" width="285" height="136" rx="24" fill="#2F49F5"/>
      <text x="1114" y="900" fill="#FFFFFF">Current</text><text x="1114" y="937" fill="#EEF0FF" font-weight="500">#2F49F5</text>
      <rect x="1420" y="830" width="285" height="136" rx="24" fill="#EEF1F8"/>
      <text x="1444" y="900" fill="#10143D">Mist</text><text x="1444" y="937" fill="#49536E" font-weight="500">#EEF1F8</text>
    </g>
    <text x="100" y="1054" fill="#626C86" font-size="30" font-weight="650">Mark construction · three progressive, left-aligned strokes</text>
  </g>
</svg>
